<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نظام إدارة المدارس</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🏫%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--pri:#4f46e5;--pri2:#4338ca;--pt:#eef2ff;--bg:#f9fafb;--card:#fff;--ink:#111827;--mute:#6b7280;--line:#e5e7eb;--bad:#dc2626;--blue:#2563eb}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;line-height:1.7}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}
.app{display:flex;min-height:100vh}
aside{width:260px;flex:none;background:#fff;border-inline-end:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;z-index:40}
aside h1{margin:0;padding:22px 20px;border-bottom:1px solid var(--line);font-size:1.4rem;color:var(--pri)}
aside nav{padding:14px;display:flex;flex-direction:column;gap:6px}
aside nav a{display:flex;gap:10px;align-items:center;padding:11px 14px;border-radius:10px;color:var(--mute)}
aside nav a:hover{background:var(--bg);color:var(--ink)}
aside nav a.on{background:var(--pt);color:var(--pri2);font-weight:700}
main{flex:1;min-width:0;padding:24px;max-width:1100px}
.mb{display:none;position:fixed;top:12px;inset-inline-start:12px;z-index:50;width:46px;height:46px;border-radius:12px;border:0;background:#fff;box-shadow:0 2px 8px #0002;font-size:1.4rem;color:var(--pri)}
.ov{display:none;position:fixed;inset:0;background:#0007;z-index:30}
@media(max-width:800px){
 aside{position:fixed;inset-block:0;inset-inline-start:0;transform:translateX(100%);visibility:hidden;transition:transform .25s,visibility .25s}
 aside.open{transform:none;visibility:visible}aside.open~.ov{display:block}
 .mb{display:block}main{padding:70px 14px 40px}aside h1{margin-top:58px}
}
h2{margin:0;font-size:1.8rem}
h3{margin:0}
.ph{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:9px 18px}
.btn.p{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:500}
.btn.p:hover{background:var(--pri2)}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:18px}
.box h3{margin-bottom:12px;font-size:1.15rem}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:#fff;border:1px solid #cbd0d8;border-radius:10px;padding:9px 12px}
:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.rel{position:relative}
.cl{display:block}
.top{display:flex;gap:14px;align-items:flex-start}
.ic{width:52px;height:52px;flex:none;border-radius:12px;background:var(--pt);display:grid;place-items:center;font-size:1.5rem}
.sq{width:52px;height:52px;flex:none;border-radius:12px;object-fit:cover;border:1px solid var(--line)}
.av{width:64px;height:64px;flex:none;border-radius:50%;background:var(--pt);display:grid;place-items:center;font-size:1.5rem;overflow:hidden;border:1px solid var(--line)}
.av img{width:100%;height:100%;object-fit:cover}
.card h3{font-size:1.1rem;line-height:1.5}
.m{color:var(--mute);font-size:.88rem}
.sch{color:var(--pri);font-size:.92rem}
.ft{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:12px;padding-top:10px;font-size:.9rem;color:#4b5563}
.acts{position:absolute;top:10px;inset-inline-end:10px;display:flex;gap:2px}
.ib{border:0;background:none;font-size:1.05rem;padding:4px 6px;border-radius:8px}
.ib:hover{background:var(--bg)}
.kv div{padding:1px 0}
.kv a{color:var(--pri)}
.hero{background:linear-gradient(135deg,#4f46e5,#3b82f6);color:#fff;border-radius:18px;padding:30px;margin-bottom:20px}
.hero h2{font-size:1.9rem;margin-bottom:6px}.hero p{margin:0;opacity:.9}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:18px}
.stat{background:#fff;border:1px solid var(--line);border-inline-start:6px solid var(--c);border-radius:14px;padding:18px;display:flex;gap:14px;align-items:center}
.stat i{font-style:normal;font-size:1.8rem}.stat b{display:block;font-size:2.1rem;line-height:1.1}.stat span{color:var(--mute);font-size:.9rem}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.sb{margin-bottom:16px}
.empty{text-align:center;color:var(--mute);padding:40px 10px;border:1px dashed #d1d5db;border-radius:14px;background:#fff}
.back{display:inline-block;color:var(--pri);margin-bottom:10px}
.dg{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px;margin-top:18px}
.dg h4{margin:0 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.dh{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.dh .sq,.dh .ic{width:96px;height:96px;font-size:2.4rem}
.ev{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;position:relative}
.ev h4{margin:0 0 2px;padding-inline-end:70px}
.ev p{margin:8px 0 0;white-space:pre-wrap}
.tg{display:inline-block;background:var(--pt);color:var(--pri2);border-radius:99px;padding:0 10px;font-size:.82rem;margin-top:6px}
#m{display:none;position:fixed;inset:0;background:#0007;z-index:100;overflow:auto;padding:20px 12px}
#m.on{display:block}
#fm{background:#fff;max-width:720px;margin:0 auto;border-radius:16px;padding:22px}
#fm h3{font-size:1.5rem;margin-bottom:16px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.full{grid-column:1/-1}
.f label{display:block;font-size:.88rem;font-weight:500;margin-bottom:3px}
.ck{display:flex;align-items:center;gap:8px}.ck input{width:20px;height:20px}
.pho{display:flex;gap:12px;align-items:center}
.chk{display:flex;flex-wrap:wrap;gap:6px 16px;margin-bottom:8px;max-height:180px;overflow:auto}.chk label{display:flex;gap:6px;align-items:center;font-weight:400}.chk input{width:auto}
@media(max-width:560px){.fg{grid-template-columns:1fr}}
/* التقرير */
#rep{background:#fff;color:#111;border:1px solid var(--line);border-radius:14px;padding:24px 28px}
.rh{display:grid;grid-template-columns:1fr 2fr 1fr;gap:8px;align-items:start;padding-bottom:20px;border-bottom:2px solid #1f2a44;font-weight:500}
.rh h1{margin:0;text-align:center;font-size:1.35rem}
.rb{min-height:260px;padding:18px 0;border-bottom:2px solid #1f2a44}
.rd{text-align:center;font-size:1.7rem;line-height:1.5;margin:6px 0 14px}
.rn{text-align:center;font-size:1.7rem;margin-top:70px}.rb.e .rd{margin-top:70px;margin-bottom:0}.rb.e .rn{margin-top:0}
.re{border:1px solid #777;border-radius:8px;padding:10px 14px;margin-bottom:10px;break-inside:avoid}
.reh{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.reh .n{width:26px;height:26px;border:2px solid #1f2a44;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.85rem}
.reh .s{margin-inline-start:auto;font-weight:500}
.re p{margin:6px 0 0;white-space:pre-wrap;font-size:.95rem}
.re .x{font-size:.9rem;margin-top:4px}
.rf{display:flex;justify-content:space-between;padding-top:14px;font-weight:500}
.rf b{display:block;color:#2a3f8f;margin-top:28px;font-weight:500}
@media print{
 @page{size:A4;margin:12mm}
 aside,.mb,.ov,.noprint,#m{display:none!important}
 body{background:#fff}main{padding:0;max-width:none}
 #rep{border:0;border-radius:0;padding:0}
 html,body{height:auto!important;overflow:visible!important}
 .app{display:block!important;min-height:0!important}
 main{display:block!important;width:100%!important;overflow:visible!important}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>

function fld(f,o){

  if(t==="area")i='<textarea name="'+k+'" rows="3" '+(req?"required":"")+'>'+esc(v)+'</textarea>';
  else if(t==="ref")i='<select name="'+k+'" '+(req?"required":"")+'><option value="">اختر المدرسة</option>'+DB.schools.map(function(s){return '<option value="'+s.id+'" '+(s.id==v?"selected":"")+'>'+esc(s.name)+'</option>'}).join("")+'</select>';
  else if(t.indexOf("sel:")===0)i='<select name="'+k+'">'+t.slice(4).split("|").map(function(x){var p=x.split(":");return '<option value="'+p[0]+'" '+(p[0]==v?"selected":"")+'>'+p[1]+'</option>'}).join("")+'</select>';
  else if(t==="photo")i='<div class="pho"><div class="av" id="pv">'+(mphoto?'<img src="'+mphoto+'" alt="">':"👤")+'</div><button type="button" class="btn" data-a="mphoto">'+(mphoto?"تغيير الصورة":"رفع صورة")+'</button></div>';
  else if(t==="teachers"){
    var names=v?String(v).split("،").map(function(x){return x.trim()}).filter(Boolean):[];
    var T=DB.teachers.filter(function(x){return x.school_id==o.school_id}),known=T.map(function(x){return x.name});
    var extra=names.filter(function(n){return known.indexOf(n)<0}).join("، ");
    i=(T.length>8?'<input data-f="tf" placeholder="ابحث في أسماء المعلمين..." style="margin-bottom:6px">':"")+'<div class="chk">'+(T.map(function(x){return '<label><input type="checkbox" name="tch" value="'+esc(x.name)+'" '+(names.indexOf(x.name)>=0?"checked":"")+'> '+esc(x.name)+'</label>'}).join("")||'<span class="m">لا يوجد معلمون مسجلون لهذه المدرسة</span>')+'</div><input name="tex" placeholder="أسماء أخرى (اختياري) — افصل بينها بـ ،" value="'+esc(extra)+'">';
  }

   +'<div class="box"><h3>👥 معلمو وموظفو المدرسة ('+T.length+')</h3>'+(T.length?T.slice(0,100).map(function(t){return '<div style="padding:4px 0;border-top:1px solid var(--line)"><b>'+esc(t.name)+'</b> <span class="m">'+esc(t.role||"")+(t.role?" - ":"")+esc(stl(t))+'</span> '+tel(t.phone)+'</div>'}).join("")+(T.length>100?'<div class="row"><button class="btn" data-a="tsearch" data-i="'+s.id+'">عرض كل المعلمين ('+T.length+') في قسم المعلمين</button></div>':""):'<div class="m">لا يوجد معلمون مسجلون. أضفهم من قسم «المعلمون والموظفون».</div>')+'</div>';
},
report:function(){
  var s=DB.settings;
  return '<div class="ph noprint"><h2>تقرير الأحداث اليومية</h2><div class="row"><button class="btn p" data-a="pdf">📄 تصدير PDF</button><button class="btn" data-a="print">🖨️ طباعة التقرير</button></div></div>'
   +'<div class="box noprint"><div class="fg"><div class="f full"><label>اختر التاريخ</label><input type="date" id="rd" value="'+RD+'"></div>'
   +[["gov","المحافظة"],["adm","الإدارة التعليمية"],["sec","إعداد / مسئول الأمن"],["mgr","يعتمد / مدير الإدارة"]].map(function(f){return '<div class="f"><label>'+f[1]+'</label><input data-s="'+f[0]+'" value="'+esc(s[f[0]])+'"></div>'}).join("")
   +'</div></div><div id="rep">'+reportHtml()+'</div>';
}
};

/* ===== طباعة التقرير (تعمل حتى لو الطباعة المباشرة محجوبة) ===== */
function reportDoc(auto){
  var css=(document.querySelector("style")||{}).textContent||"";
  var m=css.match(/\/\* التقرير \*\/([\s\S]*?)@media print/);
  var rcss=(m?m[1]:"").replace(/#rep\{[^}]*\}/,"");
  return '<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>تقرير الأحداث اليومية '+RD+'</title>'
   +'<style>@page{size:A4;margin:12mm}*{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}'
   +'body{margin:0;padding:16px;background:#fff;color:#111;font-family:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;line-height:1.7}'
   +rcss+'</style></head><body><div id="rep">'+reportHtml()+'</div>'
   +(auto?'<script>window.addEventListener("load",function(){setTimeout(function(){window.print()},400)})<\/script>':'')
   +'</body></html>';
}
function printReport(){
  var fired=false,mark=function(){fired=true};
  window.addEventListener("beforeprint",mark);
  try{window.print()}catch(e){}
  setTimeout(function(){
    window.removeEventListener("beforeprint",mark);
    if(fired)return;
    $("#m").innerHTML='<div id="fm"><h3>🖨️ طباعة التقرير</h3><p>المتصفح منع الطباعة المباشرة من داخل هذه الصفحة. اختر إحدى الطريقتين:</p>'
     +'<div class="row"><button class="btn p" data-a="repopen">فتح التقرير للطباعة</button><button class="btn" data-a="pdf">تصدير PDF</button><button class="btn" data-a="repsave">حفظ التقرير كملف</button><button class="btn" data-a="closem">إغلاق</button></div>'
     +'<p class="m" style="margin-top:12px">إذا لم تفتح النافذة، احفظ الملف ثم افتحه من جهازك وسيبدأ أمر الطباعة تلقائيًا (أو اضغط Ctrl+P).</p></div>';
    $("#m").classList.add("on");
  },700);
}

function exportPdf(){
  var go=function(){
    var host=document.createElement("div");
    host.style.cssText="position:fixed;left:-10000px;top:0;width:794px;background:#fff";
    host.innerHTML='<div id="rep" style="border:0;border-radius:0;padding:24px;background:#fff;direction:rtl">'+reportHtml()+'</div>';
    document.body.appendChild(host);
    var fn="report-"+RD+".pdf";
    window.html2pdf().set({margin:[10,8,10,8],filename:fn,image:{type:"jpeg",quality:.95},
      html2canvas:{scale:2,useCORS:true,backgroundColor:"#fff"},
      jsPDF:{unit:"mm",format:"a4",orientation:"portrait"},
      pagebreak:{mode:["css","legacy"],avoid:[".re",".rf"]}})
    .from(host.firstChild).outputPdf("blob").then(function(blob){
      host.remove();
      var legacy=function(){try{var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=fn;document.body.appendChild(a);a.click();a.remove()}catch(e){}};
      var fail=function(e){if(e&&e.code==="declined")return;dlg("تعذر حفظ ملف PDF"+(e&&e.code?" ("+e.code+")":"")+". جرّب زر «فتح التقرير للطباعة» ثم اختر حفظ كـ PDF.")};
      if(window.claude&&claude.use){claude.use("downloads").then(function(d){if(d)d.save({filename:fn,data:blob}).catch(fail);else{legacy()}}).catch(function(){legacy()})}else legacy();
    }).catch(function(){host.remove();dlg("تعذر إنشاء ملف PDF. تأكد من الاتصال بالإنترنت وحاول مرة أخرى.")});
  };
  if(window.html2pdf)return go();
  var s=document.createElement("script");
  s.src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js";
  s.onload=go;
  s.onerror=function(){dlg("تعذر تحميل أداة PDF. تأكد من الاتصال بالإنترنت، أو استخدم زر الطباعة واختر «حفظ كـ PDF».")};
  document.head.appendChild(s);
}
function openReportWin(){
  var ok=false;
  try{
    var w=window.open("","_blank");
    if(w&&w.document){w.document.open();w.document.write(reportDoc(true));w.document.close();ok=true}
  }catch(e){}
  if(!ok)saveReportFile();
}
function saveReportFile(){
  var data=reportDoc(true),fn="report-"+RD+".html";
  var legacy=function(){
    try{var b=new Blob([data],{type:"text/html"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=fn;document.body.appendChild(a);a.click();a.remove()}
    catch(e){dlg("تعذر حفظ الملف.")}
  };
  if(window.claude&&claude.use){claude.use("downloads").then(function(d){if(d)d.save({filename:fn,data:data}).catch(function(e){if(!e||e.code!=="declined")dlg("تعذر حفظ الملف.")});else legacy()}).catch(legacy)}else legacy();
}
function reportHtml(){
  var s=DB.settings,p=RD.split("-"),dn=new Date(RD+"T00:00:00").toLocaleDateString("ar-EG",{weekday:"long"});
  var ev=DB.events.filter(function(e){return e.event_date===RD}).sort(function(a,b){return a.id-b.id});
  var d='<div class="rd">'+dn+" "+p[0]+"/"+(+p[1])+"/"+(+p[2])+'</div>';
  var body=ev.length?d+ev.map(function(e,i){
    return '<div class="re"><div class="reh"><span class="n">'+(i+1)+'</span><b>'+esc(e.title)+'</b><span class="s">'+esc(sname(e.school_id))+'</span></div>'
     +(e.description?'<p>'+esc(e.description)+'</p>':"")
     +(e.involved_teachers?'<div class="x"><b>المعلمون المعنيون:</b> '+esc(e.involved_teachers)+'</div>':"")
     +(e.involved_students?'<div class="x"><b>الطلاب المعنيون:</b> '+esc(e.involved_students)+'</div>':"")+'</div>';
  }).join(""):d+'<div class="rn">لا توجد احداث بالادارة</div>';
  return '<div class="rh"><div>محافظة: '+esc(s.gov)+'<br>إدارة: '+esc(s.adm)+'</div><h1>تقرير الأحداث اليومية للمدارس</h1><div></div></div>'
   +'<div class="rb'+(ev.length?"":" e")+'">'+body+'</div>'
   +'<div class="rf"><div>إعداد / مسئول الأمن<b>'+esc(s.sec)+'&nbsp;</b></div><div>يعتمد / مدير الإدارة<b>'+(esc(s.mgr)||"........................")+'</b></div></div>';
}

/* ===== التوجيه والأحداث ===== */
function render(){
  var r=ROUTE.split("/"),p=r[0]||"home",key=p==="schools"&&r[1]?"school":p;
  if(!PAGES[key]){key="home";p="home"}
  [].forEach.call(document.querySelectorAll("aside nav a"),function(a){a.classList.toggle("on",a.dataset.p===p)});
  $("#main").innerHTML=PAGES[key](r[1]);
}
function nav(path){ROUTE=path||"";S.q="";S.lim=60;S.sid=null;$("aside").classList.remove("open");try{if(location.hash.replace(/^#\/?/,"")!==ROUTE)location.hash="#/"+ROUTE}catch(e){}render();window.scrollTo(0,0)}
window.addEventListener("hashchange",function(){var h=location.hash.replace(/^#\/?/,"");if(h!==ROUTE){ROUTE=h;S.q="";S.lim=60;S.sid=null;$("aside").classList.remove("open");render();window.scrollTo(0,0)}});
var ACT={
  nav:function(i){nav(i)},
  more:function(){S.lim+=60;$("#list").innerHTML=listFn()},
  clrsid:function(){S.sid=null;S.lim=60;render()},
  tsearch:function(i){ROUTE="teachers";S.q="";S.lim=60;S.sid=+i;try{location.hash="#/teachers"}catch(e){}render();window.scrollTo(0,0)},
  seed:function(){loadSeed(false)},
  menu:function(){$("aside").classList.toggle("open")},
  add:function(i,t){openM(t.dataset.k,null,{})},
  edit:function(i,t){openM(t.dataset.k,i)},
  del:function(i,t){delRec(t.dataset.k,i)},
  evadd:function(i){openM("events",null,{school_id:+i})},
  sphoto:function(i){spId=i;$("#sp").click()},
  mphoto:function(){$("#mp").click()},
  print:function(){printReport()},
  repsave:function(){saveReportFile()},
  pdf:function(){exportPdf()},
  repopen:function(){openReportWin()},
  save:function(){var f=$("#fm");if(f&&f.reportValidity&&!f.reportValidity())return;saveM()},
  closem:function(){$("#m").classList.remove("on")},
  export:function(){
    var data=JSON.stringify(DB),fn="school-data-"+today()+".json";
    var legacy=function(){var b=new Blob([data],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=fn;document.body.appendChild(a);a.click();a.remove()};
    if(window.claude&&claude.use){claude.use("downloads").then(function(d){if(d)d.save({filename:fn,data:data}).catch(function(e){if(!e||e.code!=="declined")dlg("تعذر حفظ الملف.")});else legacy()}).catch(legacy)}else legacy();
  },
  import:function(){$("#imf").click()}
};
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-a]");
  if(t&&ACT[t.dataset.a]){e.preventDefault();ACT[t.dataset.a](t.dataset.i,t,e);return}
  if(e.target.id==="m")ACT.closem();
});
document.addEventListener("input",function(e){
  var t=e.target;
  if(t.id==="q"){S.q=t.value.trim();S.lim=60;$("#list").innerHTML=listFn()}
  else if(t.dataset&&t.dataset.f==="tf"){var nq=norm(t.value);[].forEach.call(t.parentNode.querySelectorAll(".chk label"),function(l){l.style.display=!nq||norm(l.textContent).indexOf(nq)>=0?"":"none"})}
  else if(t.dataset&&t.dataset.s){DB.settings[t.dataset.s]=t.value;saveDB();$("#rep").innerHTML=reportHtml()}
});
document.addEventListener("change",function(e){
  var t=e.target;
  if(t.id==="rd"){RD=t.value||RD;$("#rep").innerHTML=reportHtml()}
  else if(t.id==="sp"&&t.files[0]){
    shrink(t.files[0],500).then(function(u){var s=DB.schools.filter(function(x){return x.id==spId})[0];if(s){s.photo=u;saveDB();render()}}).catch(function(){dlg("حدث خطأ أثناء رفع الصورة")});t.value="";
  }
  else if(t.id==="mp"&&t.files[0]){
    shrink(t.files[0],260).then(function(u){mphoto=u;var pv=$("#pv");if(pv)pv.innerHTML='<img src="'+u+'" alt="">'}).catch(function(){dlg("حدث خطأ أثناء رفع الصورة")});t.value="";
  }
  else if(t.id==="imf"&&t.files[0]){
    var r=new FileReader();r.onload=function(){
      try{var o=JSON.parse(r.result);if(!o||!Array.isArray(o.schools)||!Array.isArray(o.teachers)||!Array.isArray(o.events))throw 0;
        dlg("سيتم استبدال البيانات الحالية ببيانات النسخة الاحتياطية. هل تريد المتابعة؟",function(){
          DB.schools=o.schools;DB.teachers=o.teachers;DB.events=o.events;DB.seq=o.seq||1;DB.seeded=!!o.seeded;DB.settings=Object.assign(DB.settings,o.settings||{});saveDB();render()})}
      catch(x){dlg("الملف غير صالح. اختر ملف نسخة احتياطية صدّرته من هذا البرنامج.")}
    };r.readAsText(t.files[0]);t.value="";
  }
});
window.addEventListener("error",function(e){try{dlg("حدث خطأ: "+e.message)}catch(x){}});
loadDB();
if(!DB.seeded&&$("#seed"))loadSeed(true);
else render();
</script>
</body>
